# Course Information - Software Product Engineering Leadership (SPEL)
# Formerly Developing Open Source Software Products (DOSSP).
# The repository name remains course_dossp until the semester break; see
# ~working/reports/fall-2026-course-content-audit-260818.md for rename scope.
# This file contains the configuration for spinning up a new course instance
course:
  display_title: "Software Product Engineering Leadership"
  title:
    - "Special Topics: Software Product Engineering Leadership"
  course_number:
    - "CSCI-5930"
  section:
    - "01"
  crn:
    - "16540"
  semester: "271"
  academic_year: "2026-2027"
  start_date: "2026-08-19"
  end_date: "2026-12-04"

  instructors:
    - name: "Daniel Shown"
      email: "daniel.shown@slu.edu"
      github_username: "kungfuchicken"
      office_hours_link: "https://calendly.com/daniel-shown/30min"

# Roster Configuration
roster:
  path: "./roster-spel-final.csv"

# Canvas Configuration
canvas:
  instance_url: "https://canvas.slu.edu/"
  course_id: 97306
  publish_on_create: false

# GitHub Configuration
github:
  organization: "oss-slu"
  existing_repo:
    - "oss-slu/course_dossp"
    - "oss-slu/course_capstone"
    - "oss-slu/handbook_tech_lead"
    - "oss-slu/handbook_developer"
    - "oss-slu/guidebook_tech_debt"

  private_repo: true
  protect_main: true
  # GitHub Project configuration
  project:
    create_project: true
    create_issues: true
    project_name_template: "SPEL - {semester}"
    student_role: read
    labels:
      - name: "reading"
        color: "0075ca"
        description: "Required reading for the course"
      - name: "discussion"
        color: "7057ff"
        description: "Discussion topic or meeting"
      - name: "tech-lead"
        color: "008672"
        description: "Tech Lead responsibility"
      - name: "feedback"
        color: "d93f0b"
        description: "Ungraded feedback on product/service work tied to the team project"
      - name: "workshop"
        color: "fbca04"
        description: "In-class workshop activity"
      - name: "evaluation"
        color: "000000"
        description: "Graded evaluation of Developer performance"

# Slack Configuration
slack:
  create_channels: true
  workspace_id: "T03ND1N37T5"
  channel_prefix: "spel"
  channels:
    - name: "csci-{prefix}-{semester}"
      description: "SPEL Course Channel"
      is_private: true

