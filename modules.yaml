  - name: Good Practices
    items:
      - name: Good Practices Due Dates Are Firm Deadlines
        type: label
        description: >
          Good practices are strongly recommended practices tied to key dates and events in the software development lifeccycle.
          Because they are tied to the timeline of the lifecycle, the deadlines are important and firm. 
          There are no "points" attached to late work, but late submissions will factor in performance evaluations.

          Completing good practices in a timely fashion is required to get at least a B in the course.
          
          We say "Good Practices" instead of "Best Practices" because there is not a single, universal, context-free "best". We must adapt these practices to a specific local context. If completing a good practice doesn't make sense or requires adaptation, please document the rationale for the choice you are making and an explanation of your adaptations.
      - name: Exception Reports
        type: content
        content: exception_reports.md
