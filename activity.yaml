# No `roles_baselines`. The course states the tech lead minimum as an
# obligation rather than a count -- content/sprint_structure_expectations.md:
# "Acknowledge PRs within 24 hours, complete reviews within 48 hours".
# There is no number of reviews anywhere, so declaring one would flag tech
# leads against a figure nobody in the course wrote down. The built-in
# defaults apply and are visible in the run header.
#
# Promptness is the measure that would actually match the course, and
# nothing collects it. #140 and #141 are the nearest work.
feedback: {}

# Teams, so a tech lead's engagement can be read beside the team they are
# accountable for. Same bindings as the capstone.
teams:
