    name: Sprint Zero
    starts: "2026-08-19"
    ends: "2026-08-31"
    decay_rate: 0.1
  - number: 1
    starts: "2026-08-31"
    ends: "2026-09-14"
    decay_rate: 0.1
  - number: 2
    starts: "2026-09-14"
    ends: "2026-09-28"
    decay_rate: 0.1
  - number: 3
    starts: "2026-09-28"
    ends: "2026-10-12"
    decay_rate: 0.1
  - number: 4
    starts: "2026-10-12"
    ends: "2026-10-26"
    decay_rate: 0.1
  - number: 5
    starts: "2026-10-26"
    ends: "2026-11-09"
    decay_rate: 0.1
  - number: 6
