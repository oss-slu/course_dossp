# Sprint close assignments. The tech lead close is submission_types: none --
# a checkpoint marker with no artifact -- so there is nothing for
# `feedback demos` to collect here. Recorded for the fetch path and for
# iteration-to-assignment resolution.
checkpoints: []

# What each role is evaluated against.
#
# Four components come from the Tech Lead Evaluation Rubric in
# `assignments/reflect-performance_evaluation_1.md`; the fifth is
# `assignments/demonstrate_professional_leadership.md`, whose own heading is
# "Leadership Capacity Building".
#
# **The weights here are not the four numbers in that rubric file.** It states
# 35/35/15/15, and those are percentages of its own 90-point core evaluation --
# its parenthetical point figures say so: "35% (31.5 points)". Leadership
# Capacity Building carries the remaining 10 points separately. Against a
# 100-point grade that is 31.5/31.5/13.5/13.5/10, which is what these are.
#
# Writing 35/35/15/15 here would overweight the first two components by 3.5
# points each and leave the set summing to 1.10. An earlier hardcoded fallback
# in MosTidy wrote 30/30/15/15/10, which summed correctly and was wrong by 1.5
# points on each of the first two.
#
# Weights, not a scoring scheme. The rubric's stated method is instructor
# observation across communications, codebase, peer feedback, client input and
# project artifacts, with the focus on growth trajectory. Nothing multiplies
# these.
rubrics:
  tech_lead:
    stretch_category: leadership_capacity_building
    categories:
      - id: managing_team_dynamics
        name: Managing Team Dynamics
        weight: 0.315
        description: >-
          The "Lead" in Tech Lead, evaluated through all team communications:
          open communication, collaborative development, client relationships,
          retrospectives, inclusive culture, conflict resolution.
        # The four leadership deliverables, plus how much of the team's work
        # this lead actually reviewed. Slack, meetings and peer feedback are
        # absent, so most of this 31.5% still rests on observation.
        evidence: [deliverables, activity]
      - id: software_engineering_quality
        name: Software Engineering Quality
        weight: 0.315
        description: >-
          The "Tech" in Tech Lead, evaluated through codebase review: modular
          architecture, maintainability, testing practices, code review culture,
          CI/CD, technical decision documentation. On a legacy codebase, judged
          on the strategy for raising quality over time.
        # Their own contribution, and the quality gate on the repositories
        # they accept code into -- which is where the rubric locates this.
        evidence: [activity, practice]
      - id: product_project_management
        name: Product and Project Management
        weight: 0.135
        description: >-
          A coherent product vision legible to client, developers and
          contributors: vision articulation, continuous discovery, project
          management tooling, checkpoint and handoff documentation, iteration
          planning, product pitching.
        # The six checkpoint and planning documents. Submission state says a
        # document arrived and nothing about whether it is any good.
        evidence: [deliverables]
      - id: implementing_open_source_practices
        name: Implementing Open Source Practices
        weight: 0.135
        description: >-
          De-facto maintainer of an open source product. Baseline expectations
          are directly accountable: OSI license compliance, essential
          documentation, community governance, maintainer responsiveness.
        # The one component where a repository check *is* the evidence rather
        # than a proxy: the rubric makes the baseline the lead's direct
        # accountability.
        evidence: [practice]
      - id: leadership_capacity_building
        name: Leadership Capacity Building
        weight: 0.10
        description: >-
          Two leadership activities beyond primary team responsibilities,
          publicly visible: external contributions, publications, conferences,
          or cross-team knowledge sharing. Required for A-level performance and
          evaluated on ambition as much as outcome.

        # Deliberately empty. `demonstrate_professional_leadership` is due
        # 2026-12-04, after this window, so there is nothing to read yet and
        # the document should say so rather than imply an absence.
        evidence: []
# Assignments the midterm evaluation reads submission states from.
#
# Not the same as `checkpoints`, which is iteration-keyed: a checkpoint is the
# assignment an iteration closes with, and this course's Sprint Closes accept no
# submission at all. These eleven are what a tech lead is actually asked to hand
# in on or before the sprint-3 close (2026-10-12), which is the midterm's
# evidence horizon.
#
# Performance Evaluation 1 (784291) is deliberately absent: it is the instrument,
# not evidence. So are the three Sprint Closes, which would otherwise show all
# nine leads missing three deliverables each -- a deficiency that does not
# exist. The collector would exclude them anyway and record why; declaring them
# here would just make it do that work.
#
# `component` binds a deliverable to the rubric component it speaks to, and is
# validated against the rubric at load. Several have none, which is normal.
deliverables:
  # Managing Team Dynamics — all four are about how the team is led
  - assignment_id: 784279   # Checkpoint 1 - Working Agreements
    component: managing_team_dynamics
    role: tech_lead
  - assignment_id: 784306   # Checkpoint 2 - Team Outing
    component: managing_team_dynamics
    role: tech_lead
  - assignment_id: 784300   # Client Demo & Feedback 1
    component: managing_team_dynamics
    role: tech_lead
  - assignment_id: 784290   # Retrospective Facilitation
    component: managing_team_dynamics
    role: tech_lead

  # Product and Project Management — vision, planning and checkpoint documents
  - assignment_id: 784277   # Milestone 1
    component: product_project_management
    role: tech_lead
  - assignment_id: 784285   # Team OKRs
    component: product_project_management
    role: tech_lead
  - assignment_id: 784293   # Iteration Starters
    component: product_project_management
    role: tech_lead
  - assignment_id: 784283   # Team Metrics Report 1
    component: product_project_management
    role: tech_lead
  - assignment_id: 784280   # Checkpoint Artifact - Choice 1
    component: product_project_management
    role: tech_lead
  - assignment_id: 784305   # Milestone 2
    component: product_project_management
    role: tech_lead

  # Unbound. Onboarding administration rather than evidence for a component --
  # it is what closed the commit-attribution gap, not something a lead is
  # assessed on.
  - assignment_id: 803403   # Onboarding: Commit Identity

# Where a finished evaluation is posted, per role.
#
# 784291 is Performance Evaluation 1 (90 points, due 2026-10-09) -- the midterm
# instrument itself, which is why it is deliberately absent from `deliverables`
# above: it is where the evaluation goes, not evidence that feeds it.
evaluations:
  tech_lead: 784291
